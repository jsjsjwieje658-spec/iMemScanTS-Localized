name: Build TrollStore tipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iMemScan.app (iOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iMemScan.app
        run: |
          set -o pipefail
          xcodebuild -project iMemScan.xcodeproj -target iMemScan -configuration Release -arch arm64 -sdk iphoneos SYMROOT=build OBJROOT=build/obj CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log

      - name: Package TrollStore tipa
        run: |
          brew install ldid
          APP="build/Release-iphoneos/iMemScan.app"
          ldid -Sentitlements.plist "$APP/iMemScan"
          rm -f iMemScanTS.tipa
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/iMemScan.app
          zip -r9 iMemScanTS.tipa Payload
          rm -rf Payload

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMemScanTS-tipa
          path: iMemScanTS.tipa
